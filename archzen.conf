[General]
# Use `cat /usr/share/i18n/SUPPORTED | cut -d' ' -f1` to list possible values
Locale="en_US.UTF-8"
# Use `grep -i 'English' /usr/share/X11/xkb/rules/base.lst` to list possible values (replace "English" with the desired language)
KbLayout="us"
# Use `grep -i 'English' /usr/share/X11/xkb/rules/base.lst` to list possible values (replace "English" with the desired language)
KbVariant="intl,altgr-intl"
# Only numbers; number of minutes before the sudo password prompt times out, or -1 for no timeout
TimestampTimeout=-1
# Use `reflector --list-countries` to list available countries
ReflectorMirrorCountries="US"
# Only numbers; The higher the value, the longer the reflector will take to complete its run
ReflectorMirrorLimit=10
# Only numbers; Value for Pacman's "ParallelDownloads" config option
PacmanParallelDownloads=10
# true | false; Enable (or not) the multilib repository
PacmanEnableMultilib=true
# true | false; Improve zram settings if you enabled it in Arch installation
SetupZram=true
# true | false; Enables a swapfile fallback, used only if zram is unavailable or insufficient and filesystem is not btrfs
UseSwapfile=true
# true | false; If true, it will install the open-source NVIDIA drivers (`nvidia-open`) instead of the standard ones (`nvidia`)
UseNvidiaOssDrivers=false
# true | false; Installs the CachyOS repository and some CachyOS tools
EnableCachyosKit=false
# Any available in the official repository or AUR; Leave blank to not install
Kernel=
# Any available in the official repository or AUR; Leave blank to not change the shell; Only “fish” has customizations
UserShell=
# paru[-[bin|git]] | yay[-[bin|git]]; "aurbuilder" will use this behind the scenes for some tasks. Leave blank to use the default value "makepkg"
AurHelper=
# Any terminal editor available in the official repository or AUR; Leave blank to not install
Editor=
# xorg | xorg-minimal | gnome | plasma | hyprland; Leave blank to not install
DesktopProfile=
# Any available in the official repository or AUR; Leave blank to use the DesktopProfile default
Terminal=
# Any available in the official repository or AUR; Leave blank to use the DesktopProfile default
Explorer=
# Any available in the official repository or AUR; Leave blank to use the DesktopProfile default
Browser=


[WSL]
# These settings will be ignored if ArchZen is not running on a WSL installation
# true | false; Enables GUI in WSL2
EnableGUI=true
# true | false;  Enables interoperability between WSL and Windows
EnableInterop=true
Username=
UserPassword=
RootPassword=
