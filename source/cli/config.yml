# yaml-language-server: $schema=../../resources/cli/cli-parser.schema.json
$schema: ../../resources/cli/cli-parser.schema.json

name: archzen
version: 0.0.1
description: ArchZen - Stay Zen and install Arch Linux
author: Sirius Red
license: GPLv3

global_flags:
  config:
    aliases: [-c]
    description: Loads a configuration file, overriding current settings.
    type: String

commands:
  install:
    arch:
      aliases: [a]
      description: Starts the Arch Linux installer (archinstall) with minimal preset.
      action: action_install_archlinux
      root_required: true
      reboot: true

    self:
      aliases: [s]
      description: Installs ArchZen on the system for global use.
      action: action_install_archzen
      root_required: false

    desktop-profile:
      aliases: [dp]
      description: Installs and configures the selected desktop profile.
      action: action_install_desktop_profile
      root_required: true
      reboot: true
      args:
        - name: profile
          description: Desktop profile to install.
          type: String
          options: [xorg, xorg-minimal, gnome, plasma, hyprland]
          default: hyprland
          required: false

  setup:
    arch:
      aliases: [a]
      description: Configures an existing Arch Linux installation with all ArchZen customizations.
      action: action_setup_archlinux
      root_required: true
      reboot: true

    bootloader:
      aliases: [b]
      description: "Configures the bootloader (e.g., systemd-boot), including update hooks and scripts."
      action: action_setup_bootloader
      root_required: true
      reboot: true
      args:
        - name: bootloader
          description: Type of bootloader to configure.
          type: String
          options: [auto, sdboot, refind, grub, lilo]
          default: auto
          required: true
        - name: gen_scripts
          description: Generates automatic update scripts for the bootloader.
          type: Boolean
          options: [true, false]
          default: true
          required: false

    dotfiles:
      aliases: [d]
      description: Copies ArchZen configuration files (dotfiles) to ~/.config.
      action: action_setup_dotfiles
      root_required: false

    vscode:
      aliases: [vsc]
      description: Configures settings, keymaps, and installs VS Code extensions.
      action: action_setup_vscode
      root_required: false

    wsl:
      aliases: [w]
      description: Applies WSL-specific configurations and packages.
      action: action_setup_wsl
      root_required: true

    zram:
      aliases: [z]
      description: Configures and optimizes zram on the system.
      action: action_setup_zram
      root_required: true
      reboot: true

  func:
    aliases: [f]
    description: Directly executes any internal script function.
    dev: true
    action: action_exec_func
    args:
      - name: function_name
        description: Name of the existing bash function to invoke.
        type: String
        required: true
      - name: args
        description: Additional parameters and arguments to pass to the function.
        type: Array<String>
        required: false
        variadic: true
