# Kitty
map f1 show_kitty_doc conf
map alt+f1 show_kitty_doc kittens/ssh

# Copy/Paste
map ctrl+c copy_or_interrupt
map ctrl+x copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

# Tab management
map ctrl+q close_tab
map	ctrl+t new_tab
map	ctrl+shift+t new_tab_with_cwd
map ctrl+, previous_tab
map ctrl+. next_tab
map ctrl+shift+, move_tab_backward
map ctrl+shift+. move_tab_forward
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+0 goto_tab 0
map ctrl+tab select_tab

# Window management
map ctrl+alt+w close_window
map ctrl+alt+n new_window
map ctrl+w close_os_window
map ctrl+n new_os_window
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+r start_resizing_window

# Shell interaction
map ctrl+alt+c signal_child SIGTERM
map ctrl+alt+l clear_terminal reset active # Reset the terminal
map ctrl+shift+l clear_terminal to_cursor active # Clear everything on screen up to the line with the cursor or the start of the current prompt (needs shell integration)
#                                                # Useful for clearing the screen up to the shell prompt and moving the shell prompt to the top of the screen.
map ctrl+l clear_terminal to_cursor_scroll active # Same as above except cleared lines are moved into scrollback
map ctrl+down clear_terminal scroll active # Scroll the contents of the screen into the scrollback

# Mouse actions
mouse_map right click ungrabbed copy_to_clipboard
mouse_map ctrl+right click ungrabbed paste_from_clipboard
