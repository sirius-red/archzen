# See https://wiki.hyprland.org/Configuring/Variables/#input
input {
	# grep -i 'English' /usr/share/X11/xkb/rules/base.lst
	kb_layout = {{ARCHZEN_KB_LAYOUT}}
	kb_variant = {{ARCHZEN_KB_VARIANT}}
	kb_model =
    kb_options =
    kb_rules =

	follow_mouse = 1
	sensitivity = 1.0
	force_no_accel = 1
	numlock_by_default = true

	# See https://wiki.hyprland.org/Configuring/Variables/#touchpad
	# touchpad {
	# 	natural_scroll = no
	# }
}


